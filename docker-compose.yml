# Local development stack: `docker compose up --build`, then open http://localhost:3000
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: pay
      POSTGRES_PASSWORD: pay
      POSTGRES_DB: payments
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pay"]
      interval: 2s
      retries: 20
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://pay:pay@db:5432/payments
      PUBLIC_URL: http://localhost:3000
      PAYMENT_PROVIDER: sandbox
      SANDBOX_WEBHOOK_SECRET: local-sandbox-secret
      ADMIN_TOKEN: local-admin-token
      KYC_PEPPER: local-kyc-pepper
      NODE_ENV: development
    ports:
      - "3000:3000"
volumes:
  pgdata:
